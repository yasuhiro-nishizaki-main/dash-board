<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>西崎 靖弘 スプシDB</title>

  <link rel="stylesheet" href="css/style.css">

  <!-- SortableJS（ドラッグ＆ドロップ用ライブラリ） -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>

<body>

<div class="atm-frame">
  <div class="screen">
    <!-- ヘッダー -->
    <div class="screen-header">
      <div class="header-left">
        <span class="header-tag">西崎 靖弘 スプシDB</span>
      </div>
      <button class="settings-btn" onclick="openSettings()">⚙️ 設定</button>
    </div>

    <!-- メッセージバナー -->
    <div class="message-box" id="msg-box">
      行きたい場所を押してください。
    </div>

    <!-- インジケーターバー -->
    <div class="sub-banner">
      <span>ATM PORTAL ONLINE</span>
      <span class="highlight" id="status-tag">READY</span>
    </div>

    <!-- メインコンテンツ表示エリア -->
    <div class="content-area">
      <div id="app-content" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="modal-overlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>⚙️ ポータル設定</h3>
        <button class="btn-sm" onclick="closeSettings()">✕ 閉じる</button>
      </div>
      
      <div class="modal-body">
        <!-- ポータル全体の暗証番号設定 -->
        <div class="master-pin-section">
          <label>🔒 ポータル全体の暗証番号（6桁の数字）</label>
          <p style="font-size:13px; color:#166534; margin-bottom:8px;">ポータル進入時に全員に求める暗証番号です。（保護不要の場合は空欄）</p>
          <input type="text" id="master-pin-input" maxlength="6" placeholder="例: 123456（なしの場合は空欄）" onchange="masterPin = this.value">
        </div>

        <div id="settings-list"></div>

        <button class="btn-sm" onclick="addNewButton()" style="width:100%; padding:14px; margin-top:12px; background:#e6fffa; border:1px solid #319795; color:#234e52; font-size:16px;">
          ＋ 新しいボタンを追加
        </button>
      </div>

      <div class="modal-footer">
        <button class="action-btn btn-secondary" onclick="closeSettings()">キャンセル</button>
        <button class="action-btn btn-primary" onclick="saveSettings()">保存して反映</button>
      </div>
    </div>
  </div>

  <!-- カスタムダイアログ -->
  <div id="dialog-overlay" class="modal-overlay">
    <div class="dialog-box">
      <div class="dialog-msg" id="dialog-msg">メッセージ</div>
      <div id="dialog-buttons" style="display:flex; justify-content:center; gap:12px;">
        <button class="action-btn btn-primary" onclick="closeDialog()">OK</button>
      </div>
    </div>
  </div>
</div>

<script>
  // グローバル状態
  let masterPin = "";
  let configData = [];
  let isUnlocked = false;
  let pendingConfirmAction = null;
  let currentPinInput = "";
  let pendingActionAfterPin = null;

  // 1. 初期化＆設定のロード
  async function initPortal() {
    // A. リポジトリ直下の ./portal-config.json を自動読み込み試行
    try {
      const response = await fetch('./portal-config.json?v=' + Date.now());
      if (response.ok) {
        const remoteData = await response.json();
        parseLoadedData(remoteData);
        updateStatusTag("GITHUB HOSTED");
        checkSecurityAndRender();
        return;
      }
    } catch (e) {
      console.log("ローカル portal-config.json なし");
    }

    // B. LocalStorageから取得
    const localData = localStorage.getItem('atm_portal_config');
    if (localData) {
      try {
        const parsed = JSON.parse(localData);
        parseLoadedData(parsed);
        updateStatusTag("LOCAL READY");
      } catch (e) {
        configData = [];
      }
    } else {
      configData = [];
      updateStatusTag("INITIAL MODE");
    }

    checkSecurityAndRender();
  }

  function parseLoadedData(data) {
    if (Array.isArray(data)) {
      configData = data;
      masterPin = "";
    } else if (typeof data === 'object' && data !== null) {
      masterPin = data.masterPin || "";
      configData = data.buttons || [];
    }
  }

  function updateStatusTag(msg) {
    document.getElementById('status-tag').innerText = msg;
  }

  // 2. セキュリティチェック（ポータル全体ロック）
  function checkSecurityAndRender() {
    if (masterPin && masterPin.trim() !== "" && !isUnlocked) {
      // 全体ロックがかかっている場合
      promptMasterPinEntry();
    } else {
      renderScreen();
    }
  }

  // 3. 進入時の全体暗証番号入力画面
  function promptMasterPinEntry() {
    currentPinInput = "";
    const container = document.getElementById('app-content');
    const msgBox = document.getElementById('msg-box');
    container.innerHTML = "";
    msgBox.innerText = "🔒 【セキュリティ】 暗証番号(6桁)を入力してください。";

    const pinContainer = document.createElement('div');
    pinContainer.className = "pin-container";

    const pinDisplay = document.createElement('div');
    pinDisplay.className = "pin-display-box";
    pinDisplay.id = "pin-display-slots";
    updatePinDisplay(pinDisplay);

    const keypad = document.createElement('div');
    keypad.className = "pin-keypad";

    const keys = ['1','2','3','4','5','6','7','8','9','--','0','訂正'];
    keys.forEach(key => {
      const btn = document.createElement('div');
      btn.className = "keypad-btn";
      if (key === '--') btn.classList.add('keypad-btn-cancel');
      if (key === '訂正') btn.classList.add('keypad-btn-danger');
      btn.innerText = key;

      btn.onclick = () => {
        if (key === '--') return;
        if (key === '訂正') {
          currentPinInput = currentPinInput.slice(0, -1);
          updatePinDisplay(document.getElementById('pin-display-slots'));
        } else {
          if (currentPinInput.length < 6) {
            currentPinInput += key;
            updatePinDisplay(document.getElementById('pin-display-slots'));
            if (currentPinInput.length === 6) {
              setTimeout(() => {
                if (currentPinInput === masterPin.trim()) {
                  isUnlocked = true;
                  msgBox.innerText = "暗証番号を確認しました。";
                  renderScreen();
                } else {
                  msgBox.innerText = "⚠️ 暗証番号が間違っています。もう一度入力してください。";
                  currentPinInput = "";
                  updatePinDisplay(document.getElementById('pin-display-slots'));
                }
              }, 150);
            }
          }
        }
      };
      keypad.appendChild(btn);
    });

    pinContainer.appendChild(pinDisplay);
    pinContainer.appendChild(keypad);
    container.appendChild(pinContainer);
  }

  // URL種別の判定
  function detectLinkType(url) {
    if (!url) return { icon: '🔗', label: 'Web' };
    const u = url.toLowerCase();
    if (u.includes('github.io') || u.includes('github.com')) {
      return { icon: '🐙', label: 'GitHub' };
    } else if (u.includes('spreadsheet') || u.includes('docs.google.com/spreadsheets')) {
      return { icon: '📄', label: 'Sheet' };
    } else if (u.includes('drive.google.com') || u.includes('.xlsx') || u.includes('.xls')) {
      return { icon: '📊', label: 'Excel' };
    }
    return { icon: '🔗', label: 'Link' };
  }

  // 4. メイン画面描画
  function renderScreen() {
    const container = document.getElementById('app-content');
    const msgBox = document.getElementById('msg-box');
    container.innerHTML = "";

    if (!configData || configData.length === 0) {
      msgBox.innerText = "ボタンが登録されていません。";
      container.innerHTML = `
        <div class="empty-state">
          <div style="font-size:56px; margin-bottom:12px;">🏧</div>
          <p style="font-weight:bold; font-size:22px; margin-bottom:8px;">ポータル画面が空の状態です</p>
          <p style="font-size:15px; color:#4a5568;">右上の「⚙️ 設定」から新しいボタンを追加してください。</p>
        </div>
      `;
      return;
    }

    msgBox.innerText = "ご希望のお取引を押してください。";
    
    const grid = document.createElement('div');
    grid.className = 'button-grid';

    configData.forEach((btn, index) => {
      const btnEl = document.createElement('div');
      const linkInfo = btn.type === 'single' ? detectLinkType(btn.url) : { icon: '📁', label: 'Folder' };
      const hasPin = btn.pin && btn.pin.trim() !== "";
      
      btnEl.className = 'atm-btn' + (linkInfo.label === 'GitHub' ? ' atm-btn-github' : '');
      btnEl.dataset.index = index;
      btnEl.innerHTML = `
        <span style="font-size:28px;">${linkInfo.icon}</span>
        <span>${btn.title || '無題のボタン'}</span>
        ${hasPin ? '<span class="lock-badge">🔒 6桁</span>' : ''}
      `;
      
      btnEl.onclick = () => {
        handleButtonClick(btn);
      };
      grid.appendChild(btnEl);
    });

    container.appendChild(grid);

    // ★ メイン画面のボタンのみドラッグ＆ドロップ適用
    new Sortable(grid, {
      animation: 150,
      ghostClass: 'sortable-ghost',
      onEnd: function (evt) {
        // 並び替えた位置に従って配列データを更新・保存
        const movedItem = configData.splice(evt.oldIndex, 1)[0];
        configData.splice(evt.newIndex, 0, movedItem);
        saveSettingsToStorage();
      }
    });
  }

  // 5. 個別ボタン押下処理
  function handleButtonClick(btn) {
    if (btn.pin && btn.pin.trim() !== "") {
      promptButtonPinEntry(btn.pin.trim(), () => {
        executeButtonAction(btn);
      }, btn.title);
    } else {
      executeButtonAction(btn);
    }
  }

  function executeButtonAction(btn) {
    if (btn.type === 'single') {
      if (btn.url && btn.url.trim() !== '') {
        window.open(btn.url, '_blank');
      } else {
        showNotice('このボタンにはURLが設定されていません。「⚙️ 設定」からURLを設定してください。');
      }
    } else if (btn.type === 'folder') {
      showFolderView(btn);
    }
  }

  // 6. フォルダ内画面
  function showFolderView(folderBtn) {
    const container = document.getElementById('app-content');
    const msgBox = document.getElementById('msg-box');
    container.innerHTML = "";
    msgBox.innerText = `【${folderBtn.title}】 内のファイル・リンクを選択してください。`;

    const folderContainer = document.createElement('div');
    folderContainer.className = "folder-view";

    if (folderBtn.sheets && folderBtn.sheets.length > 0) {
      folderBtn.sheets.forEach(sheet => {
        const linkInfo = detectLinkType(sheet.url);
        const hasPin = sheet.pin && sheet.pin.trim() !== "";
        const itemBtn = document.createElement('div');
        itemBtn.className = 'atm-btn' + (linkInfo.label === 'GitHub' ? ' atm-btn-github' : '');
        itemBtn.style.justifyContent = 'flex-start';
        itemBtn.style.paddingLeft = '24px';
        itemBtn.innerHTML = `
          <span style="font-size:26px;">${linkInfo.icon}</span> 
          <span>${sheet.name || '名称未設定ファイル'}</span> 
          <span class="link-badge">${linkInfo.label}</span>
          ${hasPin ? '<span class="lock-badge">🔒 6桁</span>' : ''}
        `;
        
        itemBtn.onclick = () => {
          if (hasPin) {
            promptButtonPinEntry(sheet.pin.trim(), () => {
              if (sheet.url && sheet.url.trim() !== '') window.open(sheet.url, '_blank');
              else showNotice('URLが設定されていません。');
            }, sheet.name);
          } else {
            if (sheet.url && sheet.url.trim() !== '') {
              window.open(sheet.url, '_blank');
            } else {
              showNotice('URLが開けません。');
            }
          }
        };
        folderContainer.appendChild(itemBtn);
      });
    } else {
      const emptyMsg = document.createElement('div');
      emptyMsg.style.padding = '30px';
      emptyMsg.style.textAlign = 'center';
      emptyMsg.style.color = '#4a5568';
      emptyMsg.innerText = 'このフォルダにはファイルが登録されていません。';
      folderContainer.appendChild(emptyMsg);
    }

    // 戻るボタン
    const backBtn = document.createElement('div');
    backBtn.className = 'atm-btn';
    backBtn.style.background = 'linear-gradient(180deg, #4a5568 0%, #2d3748 100%)';
    backBtn.style.color = '#ffffff';
    backBtn.style.borderColor = '#1a202c';
    backBtn.style.cursor = 'pointer';
    backBtn.innerText = '⬅️ 前の画面に戻る';
    backBtn.onclick = () => {
      renderScreen();
    };
    folderContainer.appendChild(backBtn);

    container.appendChild(folderContainer);
  }

  // 7. ボタン暗証番号入力画面
  function promptButtonPinEntry(correctPin, onSuccess, title) {
    currentPinInput = "";
    pendingActionAfterPin = onSuccess;

    const container = document.getElementById('app-content');
    const msgBox = document.getElementById('msg-box');
    container.innerHTML = "";
    msgBox.innerText = `【${title || '取引'}】 暗証番号(6桁)を入力してください。`;

    const pinContainer = document.createElement('div');
    pinContainer.className = "pin-container";

    const pinDisplay = document.createElement('div');
    pinDisplay.className = "pin-display-box";
    pinDisplay.id = "pin-display-slots";
    updatePinDisplay(pinDisplay);

    const keypad = document.createElement('div');
    keypad.className = "pin-keypad";

    const keys = ['1','2','3','4','5','6','7','8','9','キャンセル','0','訂正'];
    keys.forEach(key => {
      const btn = document.createElement('div');
      btn.className = "keypad-btn";
      if (key === 'キャンセル') btn.classList.add('keypad-btn-cancel');
      if (key === '訂正') btn.classList.add('keypad-btn-danger');
      btn.innerText = key;

      btn.onclick = () => {
        if (key === 'キャンセル') {
          renderScreen();
        } else if (key === '訂正') {
          currentPinInput = currentPinInput.slice(0, -1);
          updatePinDisplay(document.getElementById('pin-display-slots'));
        } else {
          if (currentPinInput.length < 6) {
            currentPinInput += key;
            updatePinDisplay(document.getElementById('pin-display-slots'));
            if (currentPinInput.length === 6) {
              setTimeout(() => {
                if (currentPinInput === correctPin) {
                  msgBox.innerText = "暗証番号を確認しました。";
                  renderScreen();
                  if (pendingActionAfterPin) pendingActionAfterPin();
                } else {
                  msgBox.innerText = "⚠️ 暗証番号が間違っています。もう一度入力してください。";
                  currentPinInput = "";
                  updatePinDisplay(document.getElementById('pin-display-slots'));
                }
              }, 150);
            }
          }
        }
      };
      keypad.appendChild(btn);
    });

    pinContainer.appendChild(pinDisplay);
    pinContainer.appendChild(keypad);
    container.appendChild(pinContainer);
  }

  function updatePinDisplay(containerEl) {
    if (!containerEl) return;
    containerEl.innerHTML = "";
    for (let i = 0; i < 6; i++) {
      const slot = document.createElement('div');
      slot.className = "pin-digit-slot";
      if (i < currentPinInput.length) {
        slot.innerText = "●";
      } else {
        slot.innerText = "";
      }
      containerEl.appendChild(slot);
    }
  }

  /* --- 8. 設定モーダル制御 --- */
  function openSettings() {
    document.getElementById('master-pin-input').value = masterPin || "";
    renderSettingsList();
    document.getElementById('modal-overlay').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  function renderSettingsList() {
    const list = document.getElementById('settings-list');
    list.innerHTML = "";

    if (configData.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding:30px; color:#718096; font-size:15px;">ボタンがまだありません。「＋ 新しいボタンを追加」を押してください。</div>`;
      return;
    }

    configData.forEach((btn, index) => {
      const item = document.createElement('div');
      item.className = 'config-card';
      item.dataset.index = index;
      
      let html = `
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong style="color:var(--bg-green); font-size:16px;">ボタン ${index + 1}</strong>
          <span style="font-size:12px; color:#718096;">ID: ${btn.id}</span>
        </div>

        <label>ボタン表示名:</label>
        <input type="text" value="${btn.title || ''}" placeholder="例: 営業ダッシュボード" onchange="configData[${index}].title = this.value">
        
        <label>個別の暗証番号 (6桁の数字 - 不要なら空欄):</label>
        <input type="text" maxlength="6" value="${btn.pin || ''}" placeholder="例: 123456 (なしの場合は空欄)" onchange="configData[${index}].pin = this.value">

        <label>ボタンの種類:</label>
        <select onchange="changeType(${index}, this.value)">
          <option value="single" ${btn.type==='single'?'selected':''}>単一ファイル / GitHub Pages / URL直飛び</option>
          <option value="folder" ${btn.type==='folder'?'selected':''}>フォルダ (複数ファイルを格納)</option>
        </select>
      `;

      if (btn.type === 'single') {
        html += `
          <label>URL (Google Drive エクセル / スプシ等):</label>
          <input type="text" value="${btn.url || ''}" onchange="configData[${index}].url = this.value" placeholder="https://drive.google.com/... や https://...">
        `;
      } else {
        html += `<div style="margin-top:14px; font-size:14px; font-weight:bold; color:#2b6cb0;">📂 フォルダ内の登録ファイル:</div>`;
        (btn.sheets || []).forEach((sheet, sheetIdx) => {
          html += `
            <div class="sheet-link-input">
              <input type="text" value="${sheet.name || ''}" placeholder="表示名 (例: 営業売上.xlsx)" onchange="configData[${index}].sheets[${sheetIdx}].name = this.value">
              <input type="text" value="${sheet.url || ''}" placeholder="URL (https://...)" onchange="configData[${index}].sheets[${sheetIdx}].url = this.value" style="margin-top:6px;">
              <input type="text" maxlength="6" value="${sheet.pin || ''}" placeholder="ファイル個別暗証番号6桁 (任意)" onchange="configData[${index}].sheets[${sheetIdx}].pin = this.value" style="margin-top:6px;">
              <button class="btn-sm btn-danger" onclick="removeSheet(${index}, ${sheetIdx})" style="margin-top:8px;">このファイルを削除</button>
            </div>
          `;
        });
        html += `<button class="btn-sm" onclick="addSheet(${index})" style="margin-top:10px; background:#ebf8ff; color:#2b6cb0; border-color:#90cdf4;">＋ ファイル・リンクを追加</button>`;
      }

      html += `
        <div class="item-controls">
          <button class="btn-sm" onclick="moveItem(${index}, -1)" ${index===0?'disabled':''}>▲ 上へ移動</button>
          <button class="btn-sm" onclick="moveItem(${index}, 1)" ${index===configData.length-1?'disabled':''}>▼ 下へ移動</button>
          <button class="btn-sm btn-danger" onclick="confirmDeleteButton(${index})" style="margin-left:auto;">ボタン削除</button>
        </div>
      `;

      item.innerHTML = html;
      list.appendChild(item);
    });
    // ※ 設定画面内の Sortable 適用を除外（ドラッグ移動を無効化）
  }

  function changeType(index, type) {
    configData[index].type = type;
    if (type === 'folder' && !configData[index].sheets) configData[index].sheets = [];
    renderSettingsList();
  }

  function addSheet(btnIndex) {
    if (!configData[btnIndex].sheets) configData[btnIndex].sheets = [];
    configData[btnIndex].sheets.push({ name: "", url: "", pin: "" });
    renderSettingsList();
  }

  function removeSheet(btnIndex, sheetIndex) {
    configData[btnIndex].sheets.splice(sheetIndex, 1);
    renderSettingsList();
  }

  function addNewButton() {
    configData.push({
      id: Date.now(),
      title: "新しい取引",
      type: "single",
      url: "",
      pin: ""
    });
    renderSettingsList();
  }

  function moveItem(index, direction) {
    const targetIndex = index + direction;
    if (targetIndex >= 0 && targetIndex < configData.length) {
      const temp = configData[index];
      configData[index] = configData[targetIndex];
      configData[targetIndex] = temp;
      renderSettingsList();
    }
  }

  function confirmDeleteButton(index) {
    showConfirm("このボタンを削除してもよろしいですか？", () => {
      configData.splice(index, 1);
      renderSettingsList();
    });
  }

  // 自動保存用関数
  function saveSettingsToStorage() {
    const fullData = {
      masterPin: masterPin ? masterPin.trim() : "",
      buttons: configData
    };
    localStorage.setItem('atm_portal_config', JSON.stringify(fullData));
  }

  // 設定の保存
  function saveSettings() {
    saveSettingsToStorage();
    closeSettings();
    checkSecurityAndRender();
  }

  /* --- 9. ダイアログ制御 --- */
  function showNotice(msg) {
    document.getElementById('dialog-msg').innerText = msg;
    const btnContainer = document.getElementById('dialog-buttons');
    btnContainer.innerHTML = `<button class="action-btn btn-primary" onclick="closeDialog()">OK</button>`;
    document.getElementById('dialog-overlay').style.display = 'flex';
  }

  function showConfirm(msg, onConfirm) {
    document.getElementById('dialog-msg').innerText = msg;
    pendingConfirmAction = onConfirm;
    const btnContainer = document.getElementById('dialog-buttons');
    btnContainer.innerHTML = `
      <button class="action-btn btn-secondary" onclick="closeDialog()">キャンセル</button>
      <button class="action-btn btn-primary" style="background:#e53e3e;" onclick="executeConfirm()">削除する</button>
    `;
    document.getElementById('dialog-overlay').style.display = 'flex';
  }

  function executeConfirm() {
    if (pendingConfirmAction) pendingConfirmAction();
    closeDialog();
  }

  function closeDialog() {
    document.getElementById('dialog-overlay').style.display = 'none';
    pendingConfirmAction = null;
  }

  // アプリケーション起動
  window.onload = initPortal;
</script>
</body>
</html>
